name: publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "패키징만 확인 (발행 안 함)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Pack only
        if: ${{ inputs.dry_run }}
        run: npm pack --dry-run
      - name: Publish with provenance
        if: ${{ !inputs.dry_run }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
