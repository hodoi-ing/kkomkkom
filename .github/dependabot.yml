version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 메이저는 빌드 설정을 함께 바꿔야 해서 자동 PR로 받지 않는다.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node 메이저는 engines(Node 20)와 어긋날 수 있어 자동 PR로 받지 않는다.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
