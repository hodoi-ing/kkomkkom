  🟡 /api/orders는 인증 확인 없이 쓰기 요청을 받습니다. 미들웨어나 auth()를 확인하세요. 실제 앱 검사 녹화가 아니라 예시 데이터를 현재 보고서 렌더러로 출력한 화면입니다.</desc>
